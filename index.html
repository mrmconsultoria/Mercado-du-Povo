<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mercado Du Povo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#0b7a3b;
    color:white;
    padding:18px 16px;
    position:sticky;
    top:0;
    z-index:10;
}

.topo{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.carrinho{
    background:white;
    color:#0b7a3b;
    border:0;
    border-radius:20px;
    padding:9px 14px;
    font-weight:bold;
}

.banner{
    background:#ffd600;
    padding:22px 16px;
}

.banner h1{
    font-size:25px;
    margin-bottom:6px;
}

.banner p{
    font-size:15px;
}

.container{
    padding:18px 14px;
    max-width:900px;
    margin:auto;
}

h2{
    margin-bottom:12px;
}

.categorias{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:12px;
}

.categoria{
    background:white;
    border:1px solid #ddd;
    border-radius:20px;
    padding:9px 15px;
    white-space:nowrap;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.produto{
    background:white;
    border-radius:12px;
    padding:14px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.imagem{
    height:110px;
    background:#eee;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    margin-bottom:10px;
}

.nome{
    font-weight:bold;
    margin-bottom:5px;
}

.unidade{
    color:#777;
    font-size:13px;
}

.preco{
    color:#0b7a3b;
    font-size:20px;
    font-weight:bold;
    margin:8px 0;
}

.botao{
    width:100%;
    border:0;
    background:#0b7a3b;
    color:white;
    padding:10px;
    border-radius:8px;
    font-weight:bold;
}

@media(min-width:700px){
    .produtos{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="topo">
        <div class="logo">🛒 Mercado Du Povo</div>
        <button class="carrinho">🛍️ Carrinho</button>
    </div>
</header>

<section class="banner">
    <h1>Mercado Du Povo</h1>
    <p>Seu mercado de bairro, agora também online.</p>
</section>

<main class="container">

    <h2>Categorias</h2>

    <div class="categorias">
        <button class="categoria">Mercearia</button>
        <button class="categoria">Bebidas</button>
        <button class="categoria">Laticínios</button>
        <button class="categoria">Carnes</button>
        <button class="categoria">Hortifruti</button>
        <button class="categoria">Padaria</button>
        <button class="categoria">Higiene</button>
        <button class="categoria">Limpeza</button>
    </div>

    <h2 style="margin-top:20px;">Produtos</h2>

    <div class="produtos">

        <div class="produto">
            <div class="imagem">🍚</div>
            <div class="nome">Arroz branco tipo 1</div>
            <div class="unidade">5 kg</div>
            <div class="preco">R$ 27,90</div>
            <button class="botao">Adicionar</button>
        </div>

        <div class="produto">
            <div class="imagem">🫘</div>
            <div class="nome">Feijão carioca tipo 1</div>
            <div class="unidade">1 kg</div>
            <div class="preco">R$ 8,99</div>
            <button class="botao">Adicionar</button>
        </div>

        <div class="produto">
            <div class="imagem">🥛</div>
            <div class="nome">Leite UHT integral</div>
            <div class="unidade">1 L</div>
            <div class="preco">R$ 6,49</div>
            <button class="botao">Adicionar</button>
        </div>

        <div class="produto">
            <div class="imagem">🥤</div>
            <div class="nome">Refrigerante Coca-Cola</div>
            <div class="unidade">1,5 L</div>
            <div class="preco">R$ 7,49</div>
            <button class="botao">Adicionar</button>
        </div>

    </div>

</main>
<script>
const SUPABASE_URL = "https://tkfduhnzokzcmwpehbnn.supabase.co";

const SUPABASE_KEY = "sb_publishable_VW6XScrJbX75EypkuXoe-Q_4jFEbr7l";

const produtosContainer = document.querySelector(".produtos");

const emojis = {
    "Mercearia": "🛒",
    "Bebidas": "🥤",
    "Laticínios": "🥛",
    "Carnes": "🥩",
    "Hortifruti": "🍎",
    "Padaria": "🍞",
    "Higiene": "🧴",
    "Limpeza": "🧹"
};

async function carregarProdutos() {

    try {

        const resposta = await fetch(
            SUPABASE_URL +
            "/rest/v1/products?select=id,name,price,unit_label,category_id,description,available&order=created_at.asc",
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!resposta.ok) {
            throw new Error("Não foi possível carregar os produtos.");
        }

        const produtos = await resposta.json();

        const categoriasResposta = await fetch(
            SUPABASE_URL +
            "/rest/v1/categories?select=id,name",
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        const categorias = await categoriasResposta.json();

        const mapaCategorias = {};

        categorias.forEach(categoria => {
            mapaCategorias[categoria.id] = categoria.name;
        });

        produtos.forEach(produto => {

            const categoria =
                mapaCategorias[produto.category_id] || "Mercearia";

            const card = document.createElement("div");

            card.className = "produto";

            const preco = Number(produto.price).toLocaleString(
                "pt-BR",
                {
                    style: "currency",
                    currency: "BRL"
                }
            );

            card.innerHTML = `
                <div class="imagem">
                    ${emojis[categoria] || "🛒"}
                </div>

                <div class="nome">
                    ${produto.name}
                </div>

                <div class="unidade">
                    ${produto.unit_label || ""}
                </div>

                <div class="preco">
                    ${preco}
                </div>

                <button class="botao"
                    onclick="adicionarProduto('${produto.name.replace(/'/g, "\\'")}', ${produto.price})">
                    Adicionar
                </button>
            `;

            produtosContainer.appendChild(card);
        });

        console.log(
            "Produtos carregados do Supabase:",
            produtos.length
        );

    } catch (erro) {

        console.error(erro);

        const aviso = document.createElement("p");

        aviso.style.padding = "20px";
        aviso.style.color = "#b00020";
        aviso.innerText =
            "Não foi possível carregar os produtos do mercado.";

        produtosContainer.appendChild(aviso);
    }
}


let carrinho = [];

function adicionarProduto(nome, preco) {
    const item = carrinho.find(
        produto => produto.nome === nome
    );

    if (item) {
        item.quantidade++;
    } else {
        carrinho.push({
            nome: nome,
            preco: Number(preco),
            quantidade: 1
        });
    }

    alert(nome + " foi adicionado ao carrinho!");
}


carregarProdutos();
</script>
</body>
</html>
